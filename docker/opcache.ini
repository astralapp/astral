; OPcache tuning. Defaults here are safe for both local and production:
; timestamps are validated every request so bind-mounted code changes are
; picked up in dev. For maximum production throughput, set
; opcache.validate_timestamps=0 and clear the cache on each deploy.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
